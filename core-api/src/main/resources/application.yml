server:
  port: ${PORT:8080}
spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/questfund}
  data:
    mongodb:
      auto-index-creation: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
questfund:
  internal-token: ${INTERNAL_API_TOKEN:local-dev-token}
  demo-mode: ${DEMO_MODE:true}
