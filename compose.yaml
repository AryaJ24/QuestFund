services:
  mongo:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - questfund_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  questfund_mongo:
